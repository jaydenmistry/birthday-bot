[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "birthday-bot"
version = "1.0.0"
description = "Discord bot that announces member birthdays."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["discord.py>=2.7,<3"]

[project.scripts]
birthday-bot = "birthday_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["birthday_bot*"]
